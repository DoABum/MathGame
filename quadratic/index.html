<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>이차함수 평행이동 게임</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: #0f1117;
  color: #e8eaf0;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 1rem 0.75rem 2rem;
}
.container { width: 100%; max-width: 480px; }
.header { text-align: center; margin-bottom: 0.9rem; }
.header h1 { font-size: 1.25rem; font-weight: 700; }
.header p { color: #9199b0; font-size: 0.8rem; margin-top: 3px; }

/* 상태바 */
.status-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 0.75rem; }
.badge { background: #1a1d27; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #9199b0; text-align: center; }
.badge b { color: #e8eaf0; font-size: 14px; display: block; margin-top: 1px; }
.badge.combo b { color: #f0c060; }
.badge.combo { border-color: rgba(240,192,96,0.3); }

/* 타이머 */
.timer-wrap { margin-bottom: 0.9rem; }
.timer-bar-bg { height: 8px; background: #22263a; border-radius: 4px; overflow: hidden; }
.timer-bar-fill { height: 100%; border-radius: 4px; transition: width 0.1s linear, background 0.3s; }
.timer-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.timer-text { font-size: 13px; font-family: monospace; }
.timer-text.urgent { color: #e96363; }

/* 미션 카드 */
.mission-card { background: #1a1d27; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 0.85rem; }
.mission-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #5b8dee; margin-bottom: 5px; }
.mission-text { font-size: 0.92rem; color: #9199b0; }
.mission-target { font-size: 1.25rem; color: #f0c060; font-weight: 700; margin-top: 4px; font-family: monospace; letter-spacing: 0.5px; }

/* 힌트 */
.hint-wrap { margin-top: 8px; }
.hint-btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: inherit; color: #9199b0; cursor: pointer; transition: background 0.15s; min-height: 36px; }
.hint-btn:hover { background: #22263a; }
.hint-text { display: none; font-size: 12.5px; color: #aab0c4; margin-top: 6px; line-height: 1.5; padding: 6px 10px; background: #22263a; border-radius: 8px; }
.hint-text.show { display: block; }

/* 캔버스 */
.canvas-wrap { position: relative; margin-bottom: 0.75rem; border-radius: 12px; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.canvas-wrap:active { cursor: grabbing; }
canvas { display: block; width: 100%; }

/* 정보 행 */
.info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.coord-display { background: #1a1d27; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 5px 14px; font-size: 13px; font-family: monospace; color: #9199b0; }
.coord-display b { color: #5b8dee; }

/* 피드백 */
.feedback { min-height: 34px; font-size: 13.5px; line-height: 1.6; margin-bottom: 0.75rem; color: #9199b0; }
.feedback.ok { color: #7ec8a0; }
.feedback.ng { color: #f09090; }
.feedback.timeout { color: #e96363; }

/* 점수 팝업 */
.score-popup { position: fixed; pointer-events: none; font-size: 22px; font-weight: 700; color: #7ec8a0; opacity: 0; transition: opacity 0.2s; z-index: 999; font-family: monospace; }

/* 버튼 */
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
.btn { background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 13px 20px; font-size: 15px; font-family: inherit; color: #e8eaf0; cursor: pointer; transition: background 0.15s; min-height: 48px; flex: 1; }
.btn:hover { background: #22263a; }
.btn-primary { background: #5b8dee; border-color: #5b8dee; color: #fff; font-weight: 500; }
.btn-primary:hover { background: #4a7cde; }

/* 결과 */
.result-wrap { text-align: center; padding: 2.5rem 1rem; }
.result-emoji { font-size: 52px; margin-bottom: 1rem; }
.result-score { font-size: 3rem; font-weight: 700; margin-bottom: 0.25rem; }
.result-score span { font-size: 1.2rem; color: #9199b0; font-weight: 400; }
.result-msg { color: #9199b0; font-size: 14px; line-height: 1.7; margin-bottom: 1.5rem; }
.result-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 2rem; }
.stat-card { background: #1a1d27; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; text-align: center; font-size: 12px; color: #9199b0; }
.stat-card b { display: block; font-size: 1.3rem; color: #e8eaf0; margin-bottom: 2px; }
.result-btns { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📐 이차함수 평행이동</h1>
    <p>표준형 10초 · 일반형 20초 안에 그래프를 이동하세요!</p>
  </div>
  <div id="game"></div>
</div>
<div id="score-popup" class="score-popup"></div>

<script>
// 표준형 풀 a=1 (36개 → 랜덤 7개 선택)
// ── 수식 포맷 헬퍼 ──────────────────────────────────────────────
function fmtA(a) {
  if (a === 1) return '';
  if (a === 0.5) return '0.5';
  return String(a);
}
function fmtStdTarget(a, tx, ty) {
  let s = 'y = ';
  if (a !== 1) s += `${fmtA(a)}`;
  if (tx === 0) s += 'x²';
  else if (tx > 0) s += `(x − ${tx})²`;
  else s += `(x + ${Math.abs(tx)})²`;
  if (ty > 0) s += ` + ${ty}`;
  else if (ty < 0) s += ` − ${Math.abs(ty)}`;
  return s;
}
function fmtBase(a) {
  if (a === 1) return 'y = x²';
  return `y = ${fmtA(a)}x²`;
}
function fmtGenBase(a, tx, ty) {
  const b = -2 * a * tx;
  const c = a * tx * tx + ty;
  let s = (a === 1) ? 'y = x²' : `y = ${fmtA(a)}x²`;
  if (b > 0) s += ` + ${b}x`;
  else if (b < 0) s += ` − ${Math.abs(b)}x`;
  if (c > 0) s += ` + ${c}`;
  else if (c < 0) s += ` − ${Math.abs(c)}`;
  return s;
}
function quadrant(tx, ty) {
  if (tx > 0 && ty > 0) return '1사분면';
  if (tx < 0 && ty > 0) return '2사분면';
  if (tx < 0 && ty < 0) return '3사분면';
  if (tx > 0 && ty < 0) return '4사분면';
  return null;
}
function makeStdHint(a, tx, ty) {
  let hint = '';
  if (tx === 0 && ty === 0) return `기본 포물선이에요. 이동 없이 원점이 꼭짓점이에요.`;
  if (a !== 1) {
    const shape = a > 1 ? '좁은' : '넓은';
    hint += `a=${fmtA(a)}이라 ${shape} 포물선이에요. `;
  }
  if (tx === 0) hint += `좌우 이동 없이 위아래로만 ${Math.abs(ty)} 이동했어요. `;
  else if (ty === 0) hint += `위아래 이동 없이 좌우로만 ${Math.abs(tx)} 이동했어요. `;
  else {
    const qd = quadrant(tx, ty);
    if (qd) hint += `꼭짓점이 ${qd}에 있어요. `;
  }
  hint += `꼭짓점은 (${tx}, ${ty})예요.`;
  return hint;
}
function makeGenHint(a, tx, ty) {
  let hint = '';
  if (a === 1) hint = `꼭짓점 x좌표는 −b÷2로 구해요. `;
  else hint = `꼭짓점 x좌표는 −b÷(2×${fmtA(a)})로 구해요. `;
  const qd = quadrant(tx, ty);
  if (qd) hint += `꼭짓점이 ${qd}에 있어요. `;
  hint += `꼭짓점을 표준형으로 바꾸면 ${fmtStdTarget(a, tx, ty)}이에요.`;
  return hint;
}

// ── 풀 자동 생성 ────────────────────────────────────────────────
function makePool(aValues, txRange, tyRange, general) {
  const pool = [], seen = new Set();
  for (const a of aValues) {
    for (let tx = txRange[0]; tx <= txRange[1]; tx++) {
      for (let ty = tyRange[0]; ty <= tyRange[1]; ty++) {
        const key = `${a},${tx},${ty}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const base = general ? fmtGenBase(a, tx, ty) : fmtBase(a);
        const target = general
          ? `꼭짓점 (${tx < 0 ? '−' + Math.abs(tx) : tx}, ${ty < 0 ? '−' + Math.abs(ty) : ty})`
          : fmtStdTarget(a, tx, ty);
        const hint = general ? makeGenHint(a, tx, ty) : makeStdHint(a, tx, ty);
        const entry = { a, tx, ty, base, target, hint };
        if (general) entry.general = true;
        pool.push(entry);
      }
    }
  }
  return pool;
}

// 표준형 a=1: tx ∈ [-5,5], ty ∈ [-5,8], 꼭짓점 원점 제외
const POOL_STD = makePool([1], [-5, 5], [-5, 8], false)
  .filter(p => !(p.tx === 0 && p.ty === 0));

// 표준형 a≠1: a=2,0.5, tx ∈ [-4,4], ty ∈ [-4,7]
const POOL_STD_A = makePool([2, 0.5], [-4, 4], [-4, 7], false);

// 일반형 a=1: tx ∈ [-4,4], ty ∈ [-5,7]
const POOL_GEN = makePool([1], [-4, 4], [-5, 7], true);

// 일반형 a≠1: a=2,0.5, tx ∈ [-3,3], ty ∈ [-4,6]
const POOL_GEN_A = makePool([2, 0.5], [-3, 3], [-4, 6], true);

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function buildStages() {
  const std   = shuffle(POOL_STD).slice(0, 7).map(s => ({...s, general:false}));
  const stdA  = shuffle(POOL_STD_A).slice(0, 3).map(s => ({...s, general:false}));
  const gen   = shuffle(POOL_GEN).slice(0, 5);
  const genA  = shuffle(POOL_GEN_A).slice(0, 2);
  return [...std, ...stdA, ...gen, ...genA];
}

let STAGES = buildStages();
let TOTAL = STAGES.length;
const TIME_LIMIT = 15; // 기본값 (사용 안 함)
function getTimeLimit() { return STAGES[current].general ? 20 : 10; }
const BASE_SCORE = 100;

let current = 0, totalScore = 0, combo = 0, maxCombo = 0;
let correctCount = 0;
let dragH = 0, dragV = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragBaseH = 0, dragBaseV = 0;
let submitted = false;
let timeLeft = TIME_LIMIT;
let timerInterval = null;

const GW = 400, GH = 420;
const X_MIN = -8, X_MAX = 8, Y_MIN = -6, Y_MAX = 10;

function toCanvasX(x) { return (x - X_MIN) / (X_MAX - X_MIN) * GW; }
function toCanvasY(y) { return GH - (y - Y_MIN) / (Y_MAX - Y_MIN) * GH; }
function toGraphDX(dpx) { return dpx / GW * (X_MAX - X_MIN); }
function toGraphDY(dpy) { return -dpy / GH * (Y_MAX - Y_MIN); }

function drawCurve(ctx, a, h, v, color, lw, dash) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
  ctx.beginPath();
  let first = true;
  for (let x = X_MIN; x <= X_MAX; x += 0.04) {
    const y = a * (x - h) * (x - h) + v;
    if (y < Y_MIN - 4 || y > Y_MAX + 4) { first = true; continue; }
    const px = toCanvasX(x), py = toCanvasY(y);
    first ? (ctx.moveTo(px, py), first = false) : ctx.lineTo(px, py);
  }
  ctx.stroke(); ctx.setLineDash([]);
}

function drawScene(state) {
  const canvas = document.getElementById('gc');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const st = STAGES[current];
  ctx.clearRect(0, 0, GW, GH);
  ctx.fillStyle = '#13151f'; ctx.fillRect(0, 0, GW, GH);

  // 그리드
  ctx.lineWidth = 1;
  for (let x = Math.ceil(X_MIN); x <= X_MAX; x++) {
    ctx.strokeStyle = x % 2 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.moveTo(toCanvasX(x), 0); ctx.lineTo(toCanvasX(x), GH); ctx.stroke();
  }
  for (let y = Math.ceil(Y_MIN); y <= Y_MAX; y++) {
    ctx.strokeStyle = y % 2 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.moveTo(0, toCanvasY(y)); ctx.lineTo(GW, toCanvasY(y)); ctx.stroke();
  }

  // 축
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(toCanvasX(0), 0); ctx.lineTo(toCanvasX(0), GH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, toCanvasY(0)); ctx.lineTo(GW, toCanvasY(0)); ctx.stroke();

  // 축 레이블
  ctx.fillStyle = '#9199b0'; ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  for (let x = X_MIN+1; x <= X_MAX; x++) { if (x !== 0 && x % 2 === 0) ctx.fillText(x, toCanvasX(x), toCanvasY(0)+14); }
  ctx.textAlign = 'right';
  for (let y = Y_MIN+1; y <= Y_MAX; y++) { if (y !== 0 && y % 2 === 0) ctx.fillText(y, toCanvasX(0)-5, toCanvasY(y)+4); }
  ctx.fillText('0', toCanvasX(0)-5, toCanvasY(0)+14);

  // 오답시 정답 곡선 표시
  if (state === 'wrong') {
    drawCurve(ctx, st.a, st.tx, st.ty, 'rgba(240,192,96,0.45)', 2, [6,4]);
    ctx.fillStyle = 'rgba(240,192,96,0.7)';
    ctx.beginPath(); ctx.arc(toCanvasX(st.tx), toCanvasY(st.ty), 4, 0, Math.PI*2); ctx.fill();
  }

  // 현재 그래프
  const color = state === 'correct' ? '#7ec8a0' : state === 'wrong' ? 'rgba(91,141,238,0.5)' : '#5b8dee';
  drawCurve(ctx, st.a, dragH, dragV, color, 2.8);

  // 꼭짓점 — 정수에 스냅된 경우 강조
  const isSnapped = state === 'idle' && Number.isInteger(Math.round(dragH*10)/10) && Math.abs(dragH - Math.round(dragH)) < 0.01
                    && Math.abs(dragV - Math.round(dragV)) < 0.01;
  const dotColor = state === 'correct' ? '#7ec8a0' : isSnapped ? '#f0c060' : color;
  const dotR = isSnapped ? 7 : 5;
  if (isSnapped && state === 'idle') {
    // 스냅 글로우 링
    ctx.strokeStyle = 'rgba(240,192,96,0.35)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(toCanvasX(dragH), toCanvasY(dragV), 11, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle = dotColor;
  ctx.beginPath(); ctx.arc(toCanvasX(dragH), toCanvasY(dragV), dotR, 0, Math.PI*2); ctx.fill();

  // 좌표 업데이트
  const cd = document.getElementById('coord');
  const rh = Math.round(dragH * 10) / 10;
  const rv = Math.round(dragV * 10) / 10;
  if (cd) cd.innerHTML = `꼭짓점: <b>(${rh}, ${rv})</b>`;
}

function startTimer() {
  timeLeft = getTimeLimit();
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) { timeLeft = 0; updateTimerUI(); clearInterval(timerInterval); onTimeout(); }
    else updateTimerUI();
  }, 100);
}

function updateTimerUI() {
  const fill = document.getElementById('timer-fill');
  const text = document.getElementById('timer-text');
  if (!fill || !text) return;
  const limit = getTimeLimit();
  const pct = (timeLeft / limit) * 100;
  fill.style.width = pct + '%';
  text.textContent = (Math.ceil(timeLeft * 10) / 10).toFixed(1) + '초';
  if (timeLeft <= limit * 0.2) {
    fill.style.background = '#e96363';
    text.className = 'timer-text urgent';
  } else if (timeLeft <= limit * 0.5) {
    fill.style.background = '#f0c060';
    text.className = 'timer-text';
  } else {
    fill.style.background = '#5b8dee';
    text.className = 'timer-text';
  }
}

function onTimeout() {
  if (submitted) return;
  submitted = true;
  combo = 0;
  updateCombo();
  drawScene('wrong');
  const st = STAGES[current];
  const fb = document.getElementById('fb');
  fb.className = 'feedback timeout';
  fb.textContent = `⏰ 시간 초과! 목표 꼭짓점은 (${st.tx}, ${st.ty})였어요.`;
  showNextBtn();
}

function updateCombo() {
  const el = document.getElementById('combo-val');
  if (el) el.textContent = combo + 'x';
}

function showScorePopup(pts, canvas) {
  const popup = document.getElementById('score-popup');
  const rect = canvas.getBoundingClientRect();
  popup.textContent = '+' + pts;
  popup.style.left = (rect.left + rect.width / 2 - 30) + 'px';
  popup.style.top = (rect.top + 60) + 'px';
  popup.style.opacity = '1';
  popup.style.fontSize = pts >= 200 ? '28px' : '22px';
  popup.style.color = pts >= 200 ? '#f0c060' : '#7ec8a0';
  setTimeout(() => { popup.style.opacity = '0'; }, 900);
}

function checkAnswer() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  const st = STAGES[current];
  const dh = Math.abs(dragH - st.tx);
  const dv = Math.abs(dragV - st.ty);
  const ok = dh <= 0.45 && dv <= 0.45;
  const fb = document.getElementById('fb');

  if (ok) {
    combo++;
    correctCount++;
    if (combo > maxCombo) maxCombo = combo;
    const timeBonus = Math.round(timeLeft * 10);
    const comboBonus = combo >= 3 ? combo : 1;
    const pts = (BASE_SCORE + timeBonus) * comboBonus;
    totalScore += pts;
    updateCombo();
    updateScore();
    drawScene('correct');
    fb.className = 'feedback ok';
    let msg = `✓ 정답! +${pts}점`;
    if (timeBonus > 0) msg += ` (시간보너스 +${timeBonus})`;
    if (combo >= 2) msg += ` 🔥 ${combo}콤보!`;
    fb.textContent = msg;
    const canvas = document.getElementById('gc');
    if (canvas) showScorePopup(pts, canvas);
  } else {
    combo = 0;
    updateCombo();
    drawScene('wrong');
    fb.className = 'feedback ng';
    fb.textContent = `✗ 아쉬워요. 목표 꼭짓점은 (${st.tx}, ${st.ty})예요.`;
  }
  showNextBtn();
}

function showNextBtn() {
  const btnRow = document.getElementById('btn-row');
  if (!btnRow) return;
  btnRow.innerHTML = '';
  const nb = document.createElement('button');
  const isLast = current + 1 >= TOTAL;
  const isTransition = current + 1 === 10; // 10번 끝나고 11번(일반형) 시작 전
  nb.className = isLast ? 'btn btn-primary' : 'btn';
  nb.textContent = isLast ? '결과 보기 →' : isTransition ? '2단계 시작 →' : '다음 단계 →';
  nb.onclick = () => {
    current++;
    if (current >= TOTAL) showResult();
    else if (current === 10) showGeneralIntro();
    else render();
  };
  btnRow.appendChild(nb);
}

function showGeneralIntro() {
  clearInterval(timerInterval);
  document.getElementById('game').innerHTML = `
    <div style="background:#1a1d27; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:2rem 1.5rem; margin-bottom:1rem;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="font-size:40px; margin-bottom:0.75rem;">📈</div>
        <div style="font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#e96363; margin-bottom:8px;">STAGE 2</div>
        <div style="font-size:1.3rem; font-weight:700; margin-bottom:6px;">일반형 도전!</div>
        <div style="font-size:0.88rem; color:#9199b0;">이제부터는 일반형 이차함수가 주어져요</div>
      </div>
      <div style="background:#13151f; border-radius:12px; padding:1.25rem; margin-bottom:1.25rem;">
        <div style="font-size:13px; color:#9199b0; margin-bottom:10px;">일반형이란?</div>
        <div style="font-family:monospace; font-size:1.05rem; color:#f0c060; font-weight:700; margin-bottom:10px;">y = ax² + bx + c</div>
        <div style="font-size:13px; color:#aab0c4; line-height:1.7;">
          일반형에서 꼭짓점을 직접 계산해서 그래프를 이동해요.<br>
          꼭짓점 x좌표: <span style="font-family:monospace; color:#7ec8a0">p = −b ÷ (2a)</span><br>
          꼭짓점 y좌표: <span style="font-family:monospace; color:#7ec8a0">x=p를 식에 대입</span>
        </div>
      </div>
      <div style="background:#13151f; border-radius:12px; padding:1.25rem; margin-bottom:1.5rem;">
        <div style="font-size:13px; color:#9199b0; margin-bottom:8px;">예시</div>
        <div style="font-family:monospace; font-size:0.95rem; color:#e8eaf0; line-height:2;">
          y = x² + 4x + 5<br>
          <span style="color:#9199b0">p = −4 ÷ (2×1) = −2</span><br>
          <span style="color:#9199b0">q = (−2)² + 4×(−2) + 5 = 1</span><br>
          <span style="color:#7ec8a0">→ 꼭짓점 (−2, 1)로 이동!</span>
        </div>
      </div>
      <div style="font-size:12px; color:#9199b0; text-align:center; margin-bottom:1.25rem;">
        콤보는 계속 이어집니다! 현재 <b style="color:#f0c060">${combo}콤보</b> 유지 중
      </div>
      <div style="text-align:center;">
        <button class="btn btn-primary" style="padding:12px 36px; font-size:15px;" onclick="render()">시작하기 →</button>
      </div>
    </div>
  `;
}

function updateScore() {
  const el = document.getElementById('score-val');
  if (el) el.textContent = totalScore;
}

function setupDrag() {
  const canvas = document.getElementById('gc');
  if (!canvas) return;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = GW / rect.width, sy = GH / rect.height;
    if (e.touches) return { x: (e.touches[0].clientX - rect.left)*sx, y: (e.touches[0].clientY - rect.top)*sy };
    return { x: (e.clientX - rect.left)*sx, y: (e.clientY - rect.top)*sy };
  }
  function onStart(e) {
    if (submitted) return; e.preventDefault(); isDragging = true;
    const p = getPos(e); dragStartX = p.x; dragStartY = p.y; dragBaseH = dragH; dragBaseV = dragV;
  }
  function onMove(e) {
    if (!isDragging) return; e.preventDefault();
    const p = getPos(e);
    let rawH = Math.max(X_MIN+.5, Math.min(X_MAX-.5, dragBaseH + toGraphDX(p.x - dragStartX)));
    let rawV = Math.max(Y_MIN+.5, Math.min(Y_MAX-.5, dragBaseV + toGraphDY(p.y - dragStartY)));
    // 정수 스냅: 0.4 이내면 자석처럼 붙음
    const snapH = Math.round(rawH);
    const snapV = Math.round(rawV);
    dragH = Math.abs(rawH - snapH) < 0.4 ? snapH : rawH;
    dragV = Math.abs(rawV - snapV) < 0.4 ? snapV : rawV;
    drawScene('idle');
  }
  function onEnd() { isDragging = false; }
  canvas.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
}

function toggleHint() {
  const ht = document.getElementById('hint-text');
  const hb = document.getElementById('hint-btn');
  if (!ht || !hb) return;
  ht.classList.toggle('show');
  hb.textContent = ht.classList.contains('show') ? '힌트 숨기기' : '💡 힌트 보기';
}

function render() {
  submitted = false; dragH = 0; dragV = 0;
  clearInterval(timerInterval);
  const st = STAGES[current];
  const pct = Math.round(current / TOTAL * 100);
  document.getElementById('game').innerHTML = `
    <div class="status-bar">
      <div class="badge">단계 <b>${current+1} / ${TOTAL}</b>${st.general ? ' <span style="font-size:10px;color:#e96363;">일반형</span>' : ''}</div>
      <div class="badge"><span style="font-size:11px">점수</span><b id="score-val">${totalScore}</b></div>
      <div class="badge combo"><span style="font-size:11px">콤보</span><b id="combo-val">${combo}x</b></div>
    </div>
    <div class="timer-wrap">
      <div class="timer-label">
        <span style="font-size:12px; color:#9199b0;">제한시간</span>
        <span class="timer-text" id="timer-text">${STAGES[current].general ? '20.0' : '10.0'}초</span>
      </div>
      <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-fill" style="width:100%; background:#5b8dee;"></div></div>
    </div>
    <div class="progress-wrap" style="height:3px; background:#22263a; border-radius:4px; margin-bottom:0.9rem; overflow:hidden;">
      <div style="height:100%; width:${pct}%; background:#5b8dee; border-radius:4px; transition:width 0.4s;"></div>
    </div>
      <div class="mission-card">
        <div class="mission-label">${st.general ? '🔴 일반형' : '목표 함수'}</div>
        <div class="mission-text">${st.general
          ? `<span style="color:#e8eaf0; font-weight:500">${st.base}</span>의 꼭짓점을 구하고 그래프를 이동하세요`
          : `기본형 <span style="color:#e8eaf0; font-weight:500">${st.base}</span>을 아래 함수가 되도록 이동하세요`
        }</div>
        <div class="mission-target">${st.target}</div>
        <div class="hint-wrap">
          <button class="hint-btn" id="hint-btn" onclick="toggleHint()">💡 힌트 보기</button>
          <div class="hint-text" id="hint-text">${st.hint}</div>
        </div>
      </div>
    <div class="canvas-wrap"><canvas id="gc" width="${GW}" height="${GH}"></canvas></div>
    <div class="info-row">
      <div class="coord-display" id="coord">꼭짓점: <b>(0, 0)</b></div>
      <span style="font-size:12px; color:#9199b0;">그래프를 드래그하세요</span>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" id="btn-row">
      <button class="btn btn-primary" onclick="checkAnswer()">정답 확인</button>
      <button class="btn" onclick="resetPos()">↺ 초기화</button>
    </div>
  `;
  drawScene('idle');
  setupDrag();
  startTimer();
}

function resetPos() { if (submitted) return; dragH = 0; dragV = 0; drawScene('idle'); }

function showResult() {
  clearInterval(timerInterval);
  const pct = Math.round(correctCount / TOTAL * 100);
  let emoji, msg;
  if (pct === 100)    { emoji = '🏆'; msg = '모든 문제를 맞췄어요! 평행이동 완벽 이해!'; }
  else if (pct >= 80) { emoji = '⭐'; msg = '아주 잘했어요! 조금만 더 연습하면 완벽해요.'; }
  else if (pct >= 60) { emoji = '📘'; msg = 'x, y 방향 이동 개념을 더 연습해봐요.'; }
  else                { emoji = '💪'; msg = 'y = a(x−p)²+q에서 p는 x이동, q는 y이동이에요. 다시 도전!'; }
  document.getElementById('game').innerHTML = `
    <div class="result-wrap">
      <div class="result-emoji">${emoji}</div>
      <div style="font-size:13px; color:#9199b0; margin-bottom:4px;">최종 점수</div>
      <div class="result-score">${totalScore} <span>점</span></div>
      <div class="result-msg">${msg}</div>
      <div class="result-stats">
        <div class="stat-card"><b>${correctCount} / ${TOTAL}</b>정답 수</div>
        <div class="stat-card"><b>${maxCombo}x</b>최고 콤보</div>
        <div class="stat-card"><b>${Math.round(correctCount/TOTAL*100)}%</b>정답률</div>
      </div>
      <div class="result-btns">
        <button class="btn btn-primary" onclick="restartGame()">다시 하기</button>
      </div>
    </div>
  `;
}

function restartGame() {
  STAGES = buildStages();
  TOTAL = STAGES.length;
  current = 0; totalScore = 0; combo = 0; maxCombo = 0; correctCount = 0;
  render();
}

render();
</script>
</body>
</html>
